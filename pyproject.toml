[project]
name = "usage-hud"
version = "0.1.0"
description = "Always-on desktop HUD for Cursor + GitHub (and future cloud) usage limits, burn rate, and alerts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jacek Kolwas" }]
dependencies = [
  "PySide6>=6.6",
]

[project.scripts]
usage-hud = "usage_hud.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usage_hud = ["assets/*"]
